<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa en tiempo real · Geocorez</title>
  <meta name="description" content="Seguimiento en tiempo real de la ubicación y las geocercas de Geocorez.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --deep: #0b4f6c;
      --soft: #2b6f8a;
      --blue-top: #7fd6ff;
      --blue-bottom: #1e9be8;
      --green-top: #b8f26b;
      --green-bottom: #3fae2a;
      --ok: #35b82a;
      --warn: #f0a30a;
      --bad: #e5484d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", "Frutiger", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      color: var(--deep);
      background:
              radial-gradient(900px 500px at 12% -8%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
              linear-gradient(180deg, #8fd8ff 0%, #d9f4ff 48%, #e6fadb 100%);
      background-attachment: fixed;
    }

    /* Burbujas Frutiger Aero */
    .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .bubbles i {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.95), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 70%);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: inset 0 -6px 14px rgba(120,200,240,.35);
    }
    .bubbles i:nth-child(1) { width: 220px; height: 220px; left: -60px; top: 18%; }
    .bubbles i:nth-child(2) { width: 120px; height: 120px; right: 6%; top: 8%; }
    .bubbles i:nth-child(3) { width: 90px; height: 90px; right: 22%; bottom: 10%; }
    .bubbles i:nth-child(4) { width: 160px; height: 160px; left: 30%; bottom: -50px; }
    .bubbles i:nth-child(5) { width: 54px; height: 54px; left: 12%; top: 6%; }

    .app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 16px; }

    /* Glassmorphism */
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(205,239,255,.68));
      border: 1.5px solid rgba(255,255,255,.95);
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(20,100,150,.22), inset 0 1px 0 #fff;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .orb {
      width: 38px; height: 38px; border-radius: 50%; flex: none;
      background: radial-gradient(circle at 32% 28%, #f4ffd9 0%, #8fe04a 38%, #2fb52a 100%);
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(30,120,40,.35), inset 0 -4px 8px rgba(20,100,20,.25);
    }
    h1 { margin: 0; font-size: 1.35rem; line-height: 1.1; letter-spacing: .2px; }
    .brand p { margin: 2px 0 0; font-size: .8rem; color: var(--soft); }

    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600;
      background: rgba(255,255,255,.8); border: 1.5px solid #fff;
      box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(20,100,150,.18);
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #9aa9b2; box-shadow: 0 0 0 3px rgba(154,169,178,.25); }
    .pill.live .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(53,184,42,.28); }
    .pill.stale .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(240,163,10,.28); }
    .pill.off .dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(229,72,77,.25); }

    .layout { display: grid; grid-template-columns: 1fr 350px; gap: 16px; height: calc(100vh - 118px); min-height: 540px; }
    .mapwrap { position: relative; overflow: hidden; padding: 6px; }
    #map { width: 100%; height: 100%; border-radius: 15px; background: #cfeaf7; }

    /* Botones flotantes corregidos */
    .mapbtns { position: absolute; right: 18px; top: 18px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }

    .side { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding: 2px; min-height: 0; }
    .card { padding: 16px 18px; }
    h2 { margin: 0 0 10px; font-size: .95rem; text-transform: uppercase; letter-spacing: .8px; color: var(--soft); }

    .btn {
      position: relative; overflow: hidden; cursor: pointer;
      padding: 10px 20px; min-width: 135px; border-radius: 999px;
      border: 1.5px solid #fff; color: #fff; font: 600 .85rem "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
      text-shadow: 0 1px 2px rgba(0,74,115,.6);
      background: linear-gradient(180deg, var(--blue-top), var(--blue-bottom));
      box-shadow: 0 4px 10px rgba(20,100,150,.35), inset 0 -2px 4px rgba(0,60,110,.2);
      text-align: center;
    }
    .btn::before {
      content: ""; position: absolute; left: 10%; right: 10%; top: 3px; height: 45%;
      border-radius: 999px; pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.08));
    }
    .btn.green { background: linear-gradient(180deg, var(--green-top), var(--green-bottom)); text-shadow: 0 1px 2px rgba(36,107,20,.6); }
    .btn.off { background: linear-gradient(180deg, #d9e6ee, #9db4c2); text-shadow: 0 1px 2px rgba(40,70,90,.5); }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); filter: brightness(.95); }

    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; }
    dt { color: var(--soft); font-size: .85rem; }
    dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

    .list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .list li {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 12px; border-radius: 14px; font-size: .88rem; cursor: pointer;
      background: rgba(255,255,255,.7); border: 1.5px solid rgba(255,255,255,.95);
    }
    .list li:hover { background: rgba(255,255,255,.9); }
    .list .name { font-weight: 700; overflow-wrap: anywhere; }
    .list .meta { display: block; font-weight: 400; font-size: .75rem; color: var(--soft); }
    .list .empty { justify-content: center; color: var(--soft); cursor: default; }
    .chip { flex: none; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
    .chip.in { background: linear-gradient(180deg, var(--green-top), var(--green-bottom)); }
    .chip.out { background: linear-gradient(180deg, var(--blue-top), var(--blue-bottom)); }
    .status-line { font-weight: 700; }

    .pin { position: relative; width: 28px; height: 28px; }
    .pin span {
      position: absolute; inset: 4px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #f4ffd9 0%, #8fe04a 40%, #2fb52a 100%);
      border: 2.5px solid #fff; box-shadow: 0 3px 8px rgba(0,60,20,.45);
    }
    .pin::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(53,184,42,.7); animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(.7); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

    .leaflet-tooltip.fence-label {
      background: rgba(255,255,255,.92); border: 1px solid #fff; border-radius: 10px;
      color: var(--deep); font-weight: 700; box-shadow: 0 2px 8px rgba(20,100,150,.3);
    }

    footer { text-align: center; font-size: .75rem; color: var(--soft); margin-top: 14px; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .mapwrap { height: 58vh; min-height: 340px; }
      .side { overflow: visible; }
      .topbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<div class="app">
  <header class="glass topbar">
    <div class="brand">
      <span class="orb" aria-hidden="true"></span>
      <div>
        <h1>Geocorez</h1>
        <p>Mapa en tiempo real</p>
      </div>
    </div>
    <div class="pill" id="conn" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="connText">Conectando…</span>
    </div>
  </header>

  <main class="layout">
    <section class="glass mapwrap">
      <div id="map" role="application" aria-label="Mapa en tiempo real"></div>

      <!-- Botones flotantes -->
      <div class="mapbtns">
        <button class="btn" id="btnCenter" type="button">Centrar</button>
        <button class="btn green" id="btnMode" type="button">Modo: GPS</button>
        <button class="btn green" id="btnCircle" type="button">+ Círculo</button>
        <button class="btn green" id="btnDraw" type="button">Dibujar zona</button>
        <button class="btn" id="btnGeofences" type="button">Geocercas</button>
      </div>
    </section>

    <aside class="side" aria-label="Información">
      <section class="glass card">
        <h2>Ubicación actual</h2>
        <dl>
          <dt>Latitud</dt><dd id="vLat">—</dd>
          <dt>Longitud</dt><dd id="vLng">—</dd>
          <dt>Modo</dt><dd id="vMode">—</dd>
          <dt>Actualizado</dt><dd id="vAge">—</dd>
        </dl>
      </section>

      <section class="glass card">
        <h2>Geocercas</h2>
        <div class="status-line" id="fenceStatus">Sin datos todavía</div>
        <ul class="list" id="fenceList"></ul>
      </section>

      <section class="glass card">
        <h2>Eventos recientes</h2>
        <ul class="list" id="eventList"></ul>
      </section>
    </aside>
  </main>

  <footer>Geocorez · Seguimiento en tiempo real con Mapbox y Firebase</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  (function () {
    'use strict';

    var DB = 'https://geocorez-default-rtdb.firebaseio.com';
    var POLL_MS = 2000;
    var EVENTS_MS = 5000;
    var STALE_MS = 30000;

    var COLOR_IN = '#35b82a';
    var COLOR_OUT = '#1e9be8';

    var $ = function (id) { return document.getElementById(id); };

    var map = L.map('map').setView([-16.5, -68.15], 13);

    // Reemplaza por tu token público de Mapbox autorizado
    var MAPBOX_TOKEN = 'pk.eyJ1IjoieW9zaGljb3JlIiwiYSI6ImNtd2NvcTFobTA0bW4zMG85cG9mc2E2cWwifQ.L6gUJs7fyQ_ewHSXad6TLw';

    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}{r}?access_token=' + MAPBOX_TOKEN, {
      tileSize: 512,
      zoomOffset: -1,
      maxZoom: 19,
      attribution: '&copy; Mapbox'
    }).addTo(map);

    var pinIcon = L.divIcon({
      className: '',
      html: '<div class="pin"><span></span></div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    var marker = null;
    var followUser = true;
    var lastPos = null;
    var lastTs = 0;
    var connected = false;
    var fences = [];
    var fenceLayers = {};
    var fencesKey = '';
    var currentMode = 'GPS';

    function getJSON(path) {
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); }, 6000);
      return fetch(DB + path, { cache: 'no-store', signal: ctl.signal })
              .then(function (r) {
                if (!r.ok) { throw new Error('HTTP ' + r.status); }
                return r.json();
              })
              .finally(function () { clearTimeout(timer); });
    }

    function putJSON(path, data) {
      return fetch(DB + path, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(function (r) { return r.json(); });
    }

    function num(v) { var n = Number(v); return isFinite(n) ? n : null; }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function fmtAgo(ms) {
      var s = Math.max(0, Math.round(ms / 1000));
      if (s < 5) return 'ahora';
      if (s < 60) return 'hace ' + s + ' s';
      if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
      return 'hace ' + Math.floor(s / 3600) + ' h';
    }

    function fmtDate(ts) {
      var d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('es-BO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function refreshConn() {
      if (!connected) { $('conn').className = 'pill off'; $('connText').textContent = 'Sin conexión'; return; }
      if (!lastTs) { $('conn').className = 'pill stale'; $('connText').textContent = 'Esperando datos'; return; }
      var age = Date.now() - lastTs;
      $('vAge').textContent = fmtAgo(age);
      if (age > STALE_MS) { $('conn').className = 'pill stale'; $('connText').textContent = 'Sin señal reciente'; }
      else { $('conn').className = 'pill live'; $('connText').textContent = 'En vivo'; }
    }

    function renderUser(u) {
      if (!u || typeof u !== 'object') return;
      var lat = num(u.latitude), lng = num(u.longitude);
      if (lat === null || lng === null) return;

      lastPos = [lat, lng];
      lastTs = num(u.timestamp) || 0;

      if (!marker) marker = L.marker(lastPos, { icon: pinIcon }).addTo(map);
      else marker.setLatLng(lastPos);

      if (followUser) map.panTo(lastPos, { animate: true });

      $('vLat').textContent = lat.toFixed(6);
      $('vLng').textContent = lng.toFixed(6);
      currentMode = u.modo || 'GPS';
      $('vMode').textContent = currentMode === 'manual' ? 'Manual' : 'GPS';
      $('btnMode').textContent = 'Modo: ' + (currentMode === 'manual' ? 'Manual' : 'GPS');

      updateFenceState();
    }

    function insideOf(f) {
      return !!lastPos && map.distance(lastPos, [f.lat, f.lng]) <= f.radio;
    }

    function renderFences(g) {
      var list = [];
      if (g && typeof g === 'object') {
        Object.keys(g).forEach(function (id) {
          var v = g[id];
          if (!v || typeof v !== 'object') return;
          var lat = num(v.latitude), lng = num(v.longitude), r = num(v.radio);
          if (lat === null || lng === null || r === null) return;
          list.push({ id: id, nombre: String(v.nombre || 'Geocerca').slice(0, 60), lat: lat, lng: lng, radio: r });
        });
      }
      var key = JSON.stringify(list);
      if (key !== fencesKey) {
        fencesKey = key;
        fences = list;
        Object.keys(fenceLayers).forEach(function (id) { map.removeLayer(fenceLayers[id]); });
        fenceLayers = {};
        fences.forEach(function (f) {
          var c = L.circle([f.lat, f.lng], { radius: f.radio, weight: 2, fillOpacity: .22 }).addTo(map);
          c.bindTooltip(f.nombre + ' · ' + Math.round(f.radio) + ' m', { direction: 'top', className: 'fence-label' });
          fenceLayers[f.id] = c;
        });
      }
      updateFenceState();
    }

    function updateFenceState() {
      var ul = $('fenceList');
      ul.replaceChildren();
      var inside = [];

      fences.forEach(function (f) {
        var dentro = insideOf(f);
        if (dentro) inside.push(f.nombre);

        var layer = fenceLayers[f.id];
        if (layer) {
          var color = dentro ? COLOR_IN : COLOR_OUT;
          layer.setStyle({ color: color, fillColor: color });
        }

        var li = el('li');
        var left = el('div');
        left.appendChild(el('span', 'name', f.nombre));
        left.appendChild(el('span', 'meta', 'Radio: ' + Math.round(f.radio) + ' m'));
        li.appendChild(left);
        li.appendChild(el('span', 'chip ' + (dentro ? 'in' : 'out'), dentro ? 'Dentro' : 'Fuera'));

        // Hacer clic en un elemento de la lista centra el mapa en esa geocerca
        li.onclick = function() {
          map.setView([f.lat, f.lng], 16, { animate: true });
        };

        ul.appendChild(li);
      });

      if (!fences.length) {
        ul.appendChild(el('li', 'empty', 'Aún no hay geocercas creadas'));
        $('fenceStatus').textContent = 'Sin geocercas';
      } else if (inside.length) {
        $('fenceStatus').textContent = 'Dentro de: ' + inside.join(', ');
      } else {
        $('fenceStatus').textContent = 'Fuera de todas las geocercas';
      }
    }

    function renderEvents(obj) {
      var ul = $('eventList');
      ul.replaceChildren();
      var items = [];
      if (obj && typeof obj === 'object') {
        Object.keys(obj).forEach(function (k) {
          if (obj[k] && typeof obj[k] === 'object') items.push({ k: k, v: obj[k] });
        });
      }
      items.sort(function (a, b) { return a.k < b.k ? 1 : -1; });

      if (!items.length) {
        ul.appendChild(el('li', 'empty', 'Sin eventos todavía'));
        return;
      }
      items.forEach(function (it) {
        var entrada = it.v.evento === 'entrada';
        var li = el('li');
        var left = el('div');
        left.appendChild(el('span', 'name', String(it.v.geocerca || 'Geocerca').slice(0, 60)));
        left.appendChild(el('span', 'meta', fmtDate(num(it.v.timestamp))));
        li.appendChild(left);
        li.appendChild(el('span', 'chip ' + (entrada ? 'in' : 'out'), entrada ? 'Entrada' : 'Salida'));
        ul.appendChild(li);
      });
    }

    function tick() {
      Promise.all([getJSON('/usuario_activo.json'), getJSON('/geocercas.json')])
              .then(function (res) {
                connected = true;
                renderUser(res[0]);
                renderFences(res[1]);
              })
              .catch(function () { connected = false; })
              .finally(function () { refreshConn(); setTimeout(tick, POLL_MS); });
    }

    function tickEvents() {
      getJSON('/eventos.json?orderBy="%24key"&limitToLast=8')
              .then(renderEvents)
              .catch(function () {})
              .finally(function () { setTimeout(tickEvents, EVENTS_MS); });
    }

    // --- Eventos de los botones ---
    $('btnCenter').onclick = function () {
      followUser = true;
      if (lastPos) map.setView(lastPos, 16, { animate: true });
    };

    $('btnMode').onclick = function () {
      var nuevoModo = (currentMode === 'manual') ? 'GPS' : 'manual';
      putJSON('/usuario_activo.json', { modo: nuevoModo }).then(function () {
        currentMode = nuevoModo;
        $('vMode').textContent = currentMode === 'manual' ? 'Manual' : 'GPS';
        $('btnMode').textContent = 'Modo: ' + (currentMode === 'manual' ? 'Manual' : 'GPS');
      });
    };

    $('btnCircle').onclick = function () {
      var center = map.getCenter();
      var nom = prompt('Nombre de geocerca:', 'Geocerca Círculo');
      if (!nom) return;
      var rad = Number(prompt('Radio en metros:', '100')) || 50;

      fetch(DB + '/geocercas.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: nom, latitude: center.lat, longitude: center.lng, radio: rad })
      });
    };

    $('btnDraw').onclick = function () {
      alert('Haz clic en el mapa para marcar el centro de la zona.');
      map.once('click', function (e) {
        var nom = prompt('Nombre de la zona dibujada:', 'Zona Dibujada');
        if (!nom) return;
        var rad = Number(prompt('Radio en metros:', '150')) || 100;

        fetch(DB + '/geocercas.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nom, latitude: e.latlng.lat, longitude: e.latlng.lng, radio: rad })
        });
      });
    };

    $('btnGeofences').onclick = function () {
      if (!fences.length) { alert('No hay geocercas.'); return; }
      var opt = prompt('Opciones de Geocercas:\n1. Eliminar una geocerca\n\nIngresa el número de la opción:', '1');
      if (opt === '1') {
        var listaTxt = fences.map(function(f, i){ return (i+1) + '. ' + f.nombre; }).join('\n');
        var sel = Number(prompt('Selecciona el número a eliminar:\n\n' + listaTxt));
        if (sel && fences[sel-1]) {
          fetch(DB + '/geocercas/' + fences[sel-1].id + '.json', { method: 'DELETE' });
        }
      }
    };

    // Clic en el mapa en modo manual cambia la posición del usuario en Firebase
    map.on('click', function (e) {
      if (currentMode === 'manual') {
        putJSON('/usuario_activo.json', {
          latitude: e.latlng.lat,
          longitude: e.latlng.lng,
          timestamp: Date.now(),
          modo: 'manual'
        });
      }
    });

    map.on('dragstart', function () { followUser = false; });

    setInterval(refreshConn, 1000);
    tick();
    tickEvents();
  })();
</script>
</body>
</html>
